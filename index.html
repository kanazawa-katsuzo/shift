<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1220">
<title>シフト希望の提出</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap">
<script>

<style>
  :root {
    --bg: #f6f6f3;
    --surface: #ffffff;
    --ink: #15171c;
    --ink-2: #4b5059;
    --muted: #8b9099;
    --line: #e9e8e3;
    --line-2: #dcdad3;
    --accent: #2b3fd6;
    --accent-soft: #edf0ff;
    --sat: #2563eb;
    --sun: #dc2626;
    --ok: #0f8a5f;
    --ok-soft: #e7f6ef;
    --warn: #b45309;
    --warn-soft: #fdf3e2;
    --danger: #d23a3a;
    --r: 16px;
    --shadow: 0 1px 2px rgba(18, 20, 28, .04), 0 6px 20px rgba(18, 20, 28, .05);
    --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  .wrap { max-width: 540px; margin: 0 auto; padding: 0 16px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- ヘッダー ---------- */
  .top { padding: 26px 2px 16px; }
  .eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .14em; color: var(--muted); }
  .period { font-size: 30px; font-weight: 800; letter-spacing: -.03em; margin: 2px 0 0; line-height: 1.2; }
  .range { font-size: 14px; color: var(--ink-2); margin-top: 2px; }

  /* ---------- 共通 ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 52px; padding: 0 22px; border-radius: 14px; border: 0; font-size: 16px; font-weight: 700; letter-spacing: .02em; transition: transform .08s, background .15s, opacity .15s; }
  .btn:active { transform: scale(.985); }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(43, 63, 214, .25); }
  .btn-primary:disabled { background: #bcc2da; box-shadow: none; cursor: not-allowed; transform: none; }
  .btn-ghost { background: var(--surface); color: var(--ink-2); border: 1px solid var(--line-2); }
  .btn-block { width: 100%; }
  .linkbtn { background: none; border: 0; color: var(--muted); font-size: 13px; font-weight: 600; padding: 4px 2px; text-decoration: underline; text-underline-offset: 3px; }
  .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .step { display: flex; align-items: center; gap: 10px; margin: 26px 2px 10px; }
  .step .n { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 12.5px; font-weight: 800; display: grid; place-items: center; }
  .step h2 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -.01em; flex: 1; }
  .step .aside { font-size: 12.5px; color: var(--muted); }

  /* ---------- ログイン・名前 ---------- */
  .auth { padding: 24px 18px; text-align: center; }
  .auth h3 { margin: 0 0 6px; font-size: 17px; }
  .auth p { margin: 0 0 16px; font-size: 13.5px; color: var(--ink-2); line-height: 1.65; white-space: pre-line; }
  .gsi { display: flex; justify-content: center; min-height: 44px; }
  .who { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; text-align: left; }
  .avatar { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: 15px; }
  .who.empty .avatar { background: #f0efea; color: var(--muted); }
  .who-text { flex: 1; min-width: 0; }
  .who-label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .who-name { font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who.empty .who-name { color: var(--accent); }
  .who-mail { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chev { flex: none; color: var(--muted); }
  .who.locked { cursor: default; }
  .who.locked .chev { display: none; }
  .acct-row { display: flex; justify-content: flex-end; margin-top: 6px; }
  .notice { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: 12px; font-size: 13.5px; margin-top: 10px; line-height: 1.55; }
  .notice.ok { background: var(--ok-soft); color: #0b5d41; }
  .notice.info { background: var(--accent-soft); color: #22348f; }
  .notice.warn { background: var(--warn-soft); color: #7a3a06; }
  .notice svg { flex: none; margin-top: 2px; }

  /* ---------- 希望なし ---------- */
  .none-card { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; text-align: left; margin-top: 10px; }
  .none-card .t { flex: 1; }
  .none-card strong { display: block; font-size: 15px; }
  .none-card span { font-size: 12.5px; color: var(--muted); }
  .switch { flex: none; width: 48px; height: 28px; border-radius: 28px; background: #d9d7d0; position: relative; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.18); transition: transform .2s; }
  .none-card[aria-checked="true"] { border-color: #f0c98b; background: #fffaf0; }
  .none-card[aria-checked="true"] .switch { background: #e08a12; }
  .none-card[aria-checked="true"] .switch::after { transform: translateX(20px); }
  .plan { transition: opacity .2s; }
  .plan.off { opacity: .3; pointer-events: none; }

  /* ---------- まとめて入力の入口 ---------- */
  .bulk-entry { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; text-align: left; margin-bottom: 12px; }
  .bulk-entry .ic { flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
  .bulk-entry .t { flex: 1; min-width: 0; }
  .bulk-entry strong { display: block; font-size: 15px; }
  .bulk-entry span { font-size: 12.5px; color: var(--muted); }

  /* ---------- 時間を選ぶシート ---------- */
  .ed-body { overflow-y: auto; padding: 6px 18px 8px; -webkit-overflow-scrolling: touch; }
  .ed-sec { margin-top: 14px; }
  .ed-sec h4 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 8px; font-size: 13px; font-weight: 800; color: var(--ink); }
  .ed-sec h4 small { font-size: 12px; font-weight: 600; color: var(--muted); }
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .ck { height: 50px; border-radius: 12px; border: 1.5px solid var(--line-2); background: var(--surface); font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; padding: 0; transition: background .12s, border-color .12s, color .12s; }
  .ck small { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: 0; margin-top: -1px; opacity: .75; }
  .ck[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .ck:disabled { opacity: .28; cursor: not-allowed; }
  .ck.other { font-size: 13px; font-weight: 700; color: var(--ink-2); border-style: dashed; }
  .ck.other[aria-pressed="true"] { color: #fff; border-style: solid; font-size: 17px; font-weight: 800; }
  .other-pick { margin-top: 10px; padding: 12px; border-radius: 14px; background: #f6f6f3; }
  .other-pick .lbl { font-size: 12px; color: var(--muted); font-weight: 700; margin: 0 0 6px 2px; }
  .grid-h { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .grid-m { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  .tk { height: 40px; border-radius: 10px; border: 1px solid var(--line-2); background: #fff; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 0; }
  .tk[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tk:disabled { opacity: .3; cursor: not-allowed; }
  .pick-quick { display: flex; gap: 8px; margin-bottom: 8px; }
  .pick-quick .qbtn { flex: 1; }
  .pick-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .pd { height: 50px; border-radius: 12px; border: 1.5px solid var(--line-2); background: var(--surface); line-height: 1.1; padding: 0; }
  .pd b { display: block; font-size: 16px; font-weight: 800; }
  .pd span { font-size: 11px; font-weight: 700; color: var(--ink-2); }
  .pd.sat b, .pd.sat span { color: var(--sat); }
  .pd.sun b, .pd.sun span { color: var(--sun); }
  .pd.picked { background: var(--accent); border-color: var(--accent); }
  .pd.picked b, .pd.picked span { color: #fff; }
  .ed-foot { padding: 12px 18px 14px; border-top: 1px solid var(--line); }
  .ed-preview { display: flex; align-items: baseline; justify-content: center; gap: 8px; font-size: 26px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-bottom: 2px; }
  .ed-preview .dim { color: #c5c8cd; }
  .ed-preview small { font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: 0; }
  .ed-err { color: var(--danger); font-size: 12.5px; font-weight: 700; text-align: center; min-height: 18px; margin-bottom: 8px; }
  .ed-actions { display: flex; gap: 8px; }
  .ed-actions .btn { height: 52px; }
  .ed-actions .btn-primary { flex: 1; }
  .ed-actions .btn-ghost { flex: none; padding: 0 16px; }

  /* ---------- 日付 ---------- */
  .quick { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .qbtn { height: 38px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line-2); background: var(--surface); font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
  .qbtn:active { background: #f0efea; }
  .qbtn.clear { margin-left: auto; border-color: transparent; background: none; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 0 4px; }
  .days { overflow: hidden; }
  .day { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 62px; padding: 10px 14px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; transition: background .12s; }
  .day:first-child { border-top: 0; }
  .day:active { background: #fafaf7; }
  .date { flex: none; width: 40px; text-align: center; line-height: 1.05; }
  .date .n { display: block; font-size: 21px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .date .w { display: block; margin-top: 3px; font-size: 11px; font-weight: 700; color: var(--ink-2); }
  .day.sat .date .n, .day.sat .date .w { color: var(--sat); }
  .day.sun .date .n, .day.sun .date .w { color: var(--sun); }
  .meta { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); }
  .meta .hol { color: var(--sun); font-weight: 700; }
  .meta .hrs { font-size: 12px; font-weight: 700; color: var(--accent); margin-top: 1px; font-family: var(--num, inherit); }
  .slot { flex: none; min-width: 128px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .slot.on { background: var(--accent-soft); color: var(--accent); }
  .slot.empty { border: 1.5px dashed var(--line-2); color: #a9adb4; font-weight: 600; font-size: 13px; }
  .day.err .slot { box-shadow: 0 0 0 2px var(--danger); }
  .err-msg { display: none; color: var(--danger); font-size: 12px; font-weight: 700; }
  .day.err .err-msg { display: block; }
  .legend { font-size: 12px; color: var(--muted); margin: 12px 4px 0; line-height: 1.7; }

  /* ---------- 下の固定バー ---------- */
  .spacer { height: 112px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(246, 246, 243, .94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); z-index: 20; }
  .bar .wrap { display: flex; align-items: center; gap: 14px; }
  .bar .sum { flex: 1; min-width: 0; }
  .bar .sum b { font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
  .bar .sum span { display: block; font-size: 12px; color: var(--muted); }
  .bar .btn { flex: none; min-width: 150px; }

  /* ---------- トースト ---------- */
  .toast { position: fixed; left: 50%; bottom: 96px; width: max-content; max-width: calc(100% - 32px); min-width: min(320px, calc(100% - 32px)); transform: translateX(-50%) translateY(12px); z-index: 50; display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 16px; border-radius: 14px; background: #1b1d22; color: #fff; font-size: 13.5px; box-shadow: 0 8px 24px rgba(0,0,0,.2); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  .toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
  .toast span { flex: 1; }
  .toast button { flex: none; height: 34px; padding: 0 12px; border-radius: 9px; border: 0; background: rgba(255,255,255,.14); color: #ffd27a; font-weight: 700; font-size: 13px; }

  /* ---------- 確認・完了 ---------- */
  .summary { padding: 20px; text-align: center; }
  .summary .name { font-size: 20px; font-weight: 800; margin: 2px 0 12px; }
  .stat { display: inline-block; padding: 6px 16px; border-radius: 99px; font-size: 14px; font-weight: 800; background: var(--accent-soft); color: var(--accent); }
  .stat.none { background: var(--warn-soft); color: var(--warn); }
  .stat-detail { margin-top: 8px; font-size: 13.5px; color: var(--muted); font-weight: 600; }
  .clabel { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .08em; margin: 22px 4px 8px; }
  .clist { padding: 2px 16px; }
  .crow { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .crow:last-child { border-bottom: 0; }
  .crow .cd { width: 88px; flex: none; font-weight: 700; font-variant-numeric: tabular-nums; }
  .crow .cd.sat { color: var(--sat); } .crow .cd.sun { color: var(--sun); }
  .crow .ct { flex: 1; text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
  .crow .ct small { color: var(--muted); font-weight: 600; margin-left: 6px; }
  .crow .cdot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .cnone { padding: 26px 8px; text-align: center; color: var(--warn); font-weight: 700; line-height: 1.7; white-space: pre-line; }
  .stack { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .done { text-align: center; padding: 56px 8px 24px; }
  .done .mark { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 18px; display: grid; place-items: center; background: var(--ok-soft); color: var(--ok); animation: pop .35s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } }
  .done h2 { font-size: 22px; margin: 0 0 8px; }
  .done p { color: var(--ink-2); margin: 0; white-space: pre-line; }
  .done .hint { margin-top: 26px; font-size: 13px; color: var(--muted); }

  /* ---------- 読み込み・エラー ---------- */
  .skel { background: linear-gradient(90deg, #ebe9e3 25%, #f3f2ee 50%, #ebe9e3 75%); background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: var(--r); }
  @keyframes sh { to { background-position: -200% 0; } }
  .fatal { padding: 28px 22px; text-align: center; margin-top: 12px; }
  .fatal h3 { margin: 0 0 8px; font-size: 17px; }
  .fatal p { margin: 0 0 18px; color: var(--ink-2); font-size: 14px; white-space: pre-line; }

  /* ---------- ボトムシート ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(18, 20, 28, .42); z-index: 40; opacity: 0; transition: opacity .2s; }
  .scrim.show { opacity: 1; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 88vh; display: flex; flex-direction: column; background: var(--surface); border-radius: 22px 22px 0 0; transform: translateY(100%); transition: transform .26s cubic-bezier(.2, .8, .2, 1); padding-bottom: env(safe-area-inset-bottom); max-width: 560px; margin: 0 auto; }
  .sheet.show { transform: none; }
  .sheet-head { padding: 10px 18px 12px; border-bottom: 1px solid var(--line); }
  .grab { width: 36px; height: 4px; border-radius: 4px; background: var(--line-2); margin: 0 auto 12px; }
  .sheet-head h3 { margin: 0; font-size: 16px; }
  .search { width: 100%; height: 44px; border: 1px solid var(--line-2); border-radius: 12px; padding: 0 12px; font-size: 16px; background: #fbfaf8; margin-top: 10px; }
  .search:focus { outline: none; border-color: var(--accent); background: #fff; }
  .sheet-note { font-size: 12.5px; color: var(--warn); margin: 8px 0 0; line-height: 1.5; }
  .sheet-list { overflow-y: auto; padding: 6px 8px 12px; -webkit-overflow-scrolling: touch; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px; border: 0; background: none; border-radius: 12px; text-align: left; font-size: 16px; font-weight: 600; }
  .opt:hover, .opt:focus { background: #f6f6f3; outline: none; }
  .opt .no { width: 32px; height: 32px; flex: none; border-radius: 50%; display: grid; place-items: center; background: #f0efea; font-size: 12px; font-weight: 800; color: var(--ink-2); }
  .opt.cur .no { background: var(--accent); color: #fff; }
  .opt:disabled { opacity: .45; cursor: not-allowed; background: none; }
  .opt .tag { margin-left: auto; font-size: 11.5px; font-weight: 700; color: var(--muted); background: #f0efea; padding: 2px 8px; border-radius: 99px; }
  .empty-list { padding: 24px; text-align: center; color: var(--muted); }

  /* ---------- ダイアログ ---------- */
  .dialog { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 24px; }
  .dialog-box { position: relative; width: 100%; max-width: 380px; background: var(--surface); border-radius: 20px; padding: 22px 20px 16px; box-shadow: 0 20px 50px rgba(18, 20, 28, .2); animation: rise .2s ease; }
  @keyframes rise { from { transform: translateY(10px); opacity: 0; } }
  .dialog-box h3 { margin: 0 0 8px; font-size: 17px; }
  .dialog-box p { margin: 0; color: var(--ink-2); font-size: 14px; white-space: pre-line; line-height: 1.65; max-height: 45vh; overflow-y: auto; }
  .dialog-actions { display: flex; gap: 8px; margin-top: 18px; }
  .dialog-actions .btn { flex: 1; height: 46px; font-size: 15px; box-shadow: none; }

  @media (min-width: 600px) { .top { padding-top: 44px; } .period { font-size: 34px; } }

  /* ======================================================================
     テーマ（見た目だけ）
     ====================================================================== */
  :root {
    --bg: #f3f4f8;
    --ink: #0f1222;
    --ink-2: #4a5068;
    --muted: #8a90a6;
    --line: #e6e8f0;
    --line-2: #d6d9e4;
    --accent: #0e7490;
    --accent-2: #0284c7;
    --accent-soft: #e6f6f8;
    --grad: linear-gradient(135deg, #0d9488 0%, #0284c7 100%);
    --r: 20px;
    --shadow: 0 1px 2px rgba(15, 18, 34, .04), 0 10px 30px -12px rgba(15, 18, 34, .12);
    --num: "Inter", -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  }
  body { background: var(--bg); }
  .num, .date .n, .slot, .ck, .tk, .pd b, .ed-preview, .bar .sum b, .crow .cd, .crow .ct, .stat { font-family: var(--num); font-feature-settings: "tnum" 1, "ss01" 1; }

  /* ヘッダー：ダークのヒーロー */
  .top { position: relative; margin: 0 -16px; padding: 30px 22px 70px; color: #fff; overflow: hidden;
    background:
      radial-gradient(120% 140% at 100% 0%, rgba(2, 132, 199, .55) 0%, rgba(2, 132, 199, 0) 55%),
      radial-gradient(90% 120% at 0% 100%, rgba(13, 148, 136, .5) 0%, rgba(13, 148, 136, 0) 60%),
      #0a1220; }
  .top::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px); background-size: 28px 28px; mask-image: linear-gradient(180deg, rgba(0,0,0,.9), transparent 85%); -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.9), transparent 85%); pointer-events: none; }
  .top > * { position: relative; z-index: 1; }
  .eyebrow { color: rgba(255,255,255,.55); display: inline-flex; align-items: center; gap: 8px; }
  .eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #5eead4; box-shadow: 0 0 10px #5eead4; }
  .period { color: #fff; font-size: 34px; margin-top: 6px; }
  .range { color: rgba(255,255,255,.7); }
  #loading, #main, #fatal, .summary, .done { position: relative; z-index: 2; }
  #loading, #main, #fatal { margin-top: -46px; }
  #viewConfirm .summary { margin-top: -46px; }
  @media (min-width: 600px) { .top { margin: 0; border-radius: 0 0 28px 28px; padding: 44px 28px 74px; } .period { font-size: 38px; } }

  /* カード */
  .card { border: 1px solid rgba(214, 217, 228, .7); }
  .who { padding: 16px; }
  .avatar { background: var(--grad); color: #fff; box-shadow: 0 6px 16px -6px rgba(2, 132, 199, .6); font-family: var(--num); }
  .who.empty .avatar { background: #eceef5; color: var(--muted); box-shadow: none; }

  /* ボタン */
  .btn-primary { background: var(--grad); box-shadow: 0 10px 24px -10px rgba(2, 132, 199, .75), inset 0 1px 0 rgba(255,255,255,.18); }
  .btn-primary:disabled { background: #c9cce0; box-shadow: none; }
  .btn-ghost { border-color: var(--line-2); }

  /* 見出し */
  .step { margin-top: 28px; }
  .step h2 { font-size: 17px; }

  /* まとめて入力の入口 */
  .bulk-entry { position: relative; overflow: hidden; background: linear-gradient(135deg, #ffffff 0%, #effaf9 100%); border-color: #cdeceb; }
  .bulk-entry .ic { background: var(--grad); color: #fff; box-shadow: 0 8px 18px -8px rgba(2, 132, 199, .7); }

  /* 日付リスト */
  .days { border-radius: 22px; }
  .day { min-height: 68px; padding: 10px 14px 10px 12px; gap: 12px; }
  .date { width: 46px; height: 48px; border-radius: 14px; background: #f3f4f8; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .date .n { font-size: 19px; letter-spacing: -.02em; }
  .date .w { margin-top: 1px; font-size: 10.5px; }
  .day.sat .date { background: #eef4ff; }
  .day.sun .date { background: #fff0f0; }
  .meta { font-size: 12.5px; }
  .slot { min-width: 136px; height: 42px; border-radius: 14px; font-size: 15.5px; }
  .slot.on { background: linear-gradient(135deg, #e7f7f5 0%, #e6f3fb 100%); color: #0b6477; box-shadow: inset 0 0 0 1px rgba(13, 148, 136, .25); }
  .slot.on::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--grad); box-shadow: 0 0 0 3px rgba(13, 148, 136, .16); }
  .slot.empty { border: 1.5px dashed #d5d8e3; color: #a7acbd; background: #fbfbfd; }

  /* 希望なし */
  .none-card .switch, .switch { background: #d8dbe6; }

  /* 下のバー：浮いたダークの帯 */
  .bar { left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); padding: 10px 0; border: 1px solid rgba(255,255,255,.08); border-radius: 22px; background: rgba(10, 18, 32, .93); color: #fff; box-shadow: 0 18px 40px -12px rgba(13, 16, 36, .55); max-width: 560px; margin: 0 auto; }
  .bar .wrap { padding: 0 10px 0 18px; }
  .bar .sum b { color: #fff; font-size: 22px; white-space: nowrap; }
  .bar .sum b em { font-style: normal; font-size: 15px; font-weight: 700; color: #5eead4; margin-left: 8px; }
  .stat-detail { white-space: pre-line; line-height: 1.7; }
  .bar .sum span { color: rgba(255,255,255,.6); }
  .bar .btn { height: 50px; border-radius: 16px; min-width: 148px; }
  .bar .btn-primary:disabled { background: rgba(255,255,255,.14); color: rgba(255,255,255,.5); }
  .spacer { height: 120px; }
  .toast { bottom: calc(100px + env(safe-area-inset-bottom)); border-radius: 16px; background: #15202e; }

  /* 時間を選ぶシート */
  .sheet { border-radius: 28px 28px 0 0; box-shadow: 0 -20px 50px -20px rgba(13, 16, 36, .35); }
  .sheet-head h3 { font-size: 17px; letter-spacing: -.01em; }
  .ck { height: 52px; border-radius: 14px; border: 1.5px solid var(--line-2); background: #fff; transition: transform .08s, background .15s, box-shadow .15s; }
  .ck:active { transform: scale(.96); }
  .ck[aria-pressed="true"] { background: var(--grad); border-color: transparent; color: #fff; box-shadow: 0 10px 20px -10px rgba(2, 132, 199, .8); }
  .ck.other { background: #fafbfe; }
  .other-pick { background: #f3f4f9; border-radius: 16px; }
  .tk[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); }
  .pd { border-radius: 14px; }
  .pd.picked { background: var(--grad); border-color: transparent; box-shadow: 0 8px 16px -10px rgba(2, 132, 199, .8); }
  .pick-quick .qbtn { background: #f3f4f9; border-color: transparent; }
  .ed-foot { background: linear-gradient(180deg, rgba(255,255,255,0), #fff 30%); }
  .ed-preview { font-size: 30px; }
  .ed-preview > :not(small):not(.dim) { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* 確認・完了 */
  .summary { border-radius: 24px; }
  .stat { background: var(--grad); color: #fff; box-shadow: 0 8px 18px -10px rgba(2, 132, 199, .8); }
  .stat.none { background: #fff1db; color: #a35a05; box-shadow: none; }
  .clist { border-radius: 22px; }
  .crow .cd::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--grad); margin: 0 10px 2px 0; }
  .done .mark { background: var(--grad); color: #fff; box-shadow: 0 16px 36px -12px rgba(2, 132, 199, .7); }
  #viewDone .done { margin-top: 10px; }

  /* 名前シート */
  .opt.cur .no { background: var(--grad); }
</style>
</head>
<body>

<!-- ===== 入力画面 ===== -->
<div id="viewInput">
  <div class="wrap">
    <header class="top">
      <div class="eyebrow">SHIFT REQUEST</div>
      <h1 class="period" id="period">シフト希望</h1>
      <div class="range" id="range">読み込み中…</div>
    </header>

    <div id="loading">
      <div class="skel" style="height:72px"></div>
      <div class="skel" style="height:66px;margin-top:26px"></div>
      <div class="skel" style="height:320px;margin-top:12px"></div>
    </div>

    <div class="card fatal" id="fatal" hidden>
      <h3 id="fatalTitle">読み込めませんでした</h3>
      <p id="fatalText"></p>
      <button class="btn btn-primary" id="btnRetry" type="button">もう一度読み込む</button>
    </div>

    <div id="main" hidden>
      <div class="card auth" id="authCard" hidden>
        <h3>Googleでログイン</h3>
        <p id="authText">本人確認のため、Googleアカウントでログインしてください。
最初の1回だけ、自分の名前を登録します。</p>
        <div class="gsi" id="gsiBtn"></div>
      </div>

      <button class="card who empty" id="btnWho" type="button">
        <div class="avatar" id="whoAvatar">?</div>
        <div class="who-text">
          <div class="who-label">提出する人</div>
          <div class="who-name" id="whoName">名前を選んでください</div>
          <div class="who-mail" id="whoMail" hidden></div>
        </div>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
      </button>
      <div class="acct-row" id="acctRow" hidden><button class="linkbtn" id="btnLogout" type="button">別のアカウントでログイン</button></div>
      <div id="statusNote"></div>

      <div id="formArea">
        <button class="card none-card" id="btnNone" type="button" role="switch" aria-checked="false">
          <div class="t">
            <strong>今回はシフトを出さない</strong>
            <span>この期間に1日も入らないときはオン</span>
          </div>
          <div class="switch"></div>
        </button>

        <div class="plan" id="plan">
          <div class="step"><h2 style="margin-left:2px">入れる日</h2><span class="aside">日付をタップして時間を選ぶ</span></div>
          <button class="card bulk-entry" id="btnBulk" type="button">
            <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><line x1="3.5" y1="10" x2="20.5" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg></span>
            <span class="t"><strong>まとめて入力</strong><span>同じ時間で入る日が多いときに</span></span>
            <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
          </button>
          <div class="card days" id="days"></div>
          <div class="quick" style="margin-top:10px"><button class="qbtn clear" type="button" id="btnClearAll">すべてクリア</button></div>
          <p class="legend">F は通し、L はラスト（閉店）までです。</p>
        </div>
      </div>
    </div>
    <div class="spacer"></div>
  </div>

  <div class="bar" id="bar" hidden>
    <div class="wrap">
      <div class="sum"><b id="sumMain">0日</b><span id="sumSub">平日 0 ・ 休日 0</span></div>
      <button class="btn btn-primary" id="btnNext" type="button">確認へ進む</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"><span id="toastText"></span><button type="button" id="toastUndo">元に戻す</button></div>

<!-- ===== 確認画面 ===== -->
<div id="viewConfirm" hidden>
  <div class="wrap">
    <header class="top">
      <div class="eyebrow">CONFIRM</div>
      <h1 class="period">提出内容の確認</h1>
      <div class="range" id="confirmRange"></div>
    </header>
    <div class="card summary">
      <div class="who-label">シフト提出者</div>
      <div class="name" id="cName"></div>
      <div id="cStats"></div>
      <div class="stat-detail" id="cDetail"></div>
    </div>
    <div class="clabel" id="cListLabel">希望</div>
    <div class="card clist" id="cList"></div>
    <div class="stack">
      <button class="btn btn-primary btn-block" id="btnSubmit" type="button">この内容で確定・提出する</button>
      <button class="btn btn-ghost btn-block" id="btnBack" type="button">修正する（戻る）</button>
    </div>
    <div style="height:40px"></div>
  </div>
</div>

<!-- ===== 完了画面 ===== -->
<div id="viewDone" hidden>
  <div class="wrap">
    <div class="done">
      <div class="mark"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12.5 10 17.5 19 7"/></svg></div>
      <h2>提出しました</h2>
      <p id="doneMsg"></p>
      <div class="stack" style="max-width:320px;margin:28px auto 0">
        <button class="btn btn-ghost btn-block" id="btnAgain" type="button">内容を見直す・出し直す</button>
      </div>
      <p class="hint">このページは閉じて大丈夫です。</p>
    </div>
  </div>
</div>

<!-- ===== 名前選択シート ===== -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-label="名前を選ぶ">
  <div class="sheet-head">
    <div class="grab"></div>
    <h3 id="sheetTitle">名前を選ぶ</h3>
    <input class="search" id="search" type="search" placeholder="名前や番号で検索" autocomplete="off">
    <p class="sheet-note" id="sheetNote" hidden>一度登録すると、自分では変更できません（間違えたときは店長に連絡してください）。</p>
  </div>
  <div class="sheet-list" id="staffList"></div>
</div>

<!-- ===== 時間を選ぶシート ===== -->
<div class="scrim" id="edScrim" hidden></div>
<div class="sheet" id="ed" hidden role="dialog" aria-labelledby="edTitle">
  <div class="sheet-head"><div class="grab"></div><h3 id="edTitle"></h3></div>
  <div class="ed-body">
    <div class="ed-sec" id="edDaysSec">
      <h4>入る日 <small id="edDaysCount"></small></h4>
      <div class="pick-quick">
        <button class="qbtn" type="button" data-pick="all">全日</button>
        <button class="qbtn" type="button" data-pick="weekday">平日</button>
        <button class="qbtn" type="button" data-pick="holiday">土日祝</button>
        <button class="qbtn" type="button" data-pick="none">解除</button>
      </div>
      <div class="pick-grid" id="edDays"></div>
    </div>
    <div class="ed-sec">
      <h4>開始</h4>
      <div class="chips" id="edStart"></div>
      <div class="other-pick" id="edStartOther" hidden></div>
    </div>
    <div class="ed-sec" id="edEndSec">
      <h4>終了</h4>
      <div class="chips" id="edEnd"></div>
      <div class="other-pick" id="edEndOther" hidden></div>
    </div>
  </div>
  <div class="ed-foot">
    <div class="ed-preview" id="edPreview"></div>
    <div class="ed-err" id="edErr"></div>
    <div class="ed-actions">
      <button class="btn btn-ghost" id="btnEdOff" type="button">入らない</button>
      <button class="btn btn-primary" id="btnEdOk" type="button">この時間で入る</button>
    </div>
  </div>
</div>

<!-- ===== ダイアログ ===== -->
<div class="scrim show" id="dlgScrim" hidden style="z-index:59"></div>
<div class="dialog" id="dlg" hidden>
  <div class="dialog-box" role="alertdialog">
    <h3 id="dlgTitle"></h3>
    <p id="dlgText"></p>
    <div class="dialog-actions">
      <button class="btn btn-ghost" id="dlgCancel" type="button" hidden></button>
      <button class="btn btn-primary" id="dlgOk" type="button">OK</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ================= 設定・状態 =================
  var params = new URLSearchParams(location.search);
  var API = (params.get("api") || API_URL || "").trim();
  var PREVIEW = params.get("preview") === "1";
  var LS_STAFF = "shift-request-staff-no";
  var LS_LAST = "shift-request-last-times";

  var DATA = null;
  var S = { staffNo: null, staffLabel: "", noShift: false, rows: {}, opt: null, last: null, ed: null, undo: null, idToken: null, email: "", registering: false, sending: false, loadToken: 0 };

  var $ = function (id) { return document.getElementById(id); };
  function h(tag, attrs, children) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "class") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k === "style") e.setAttribute("style", attrs[k]);
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function ls(key, val) {
    try {
      if (val === undefined) return localStorage.getItem(key);
      if (val === null) localStorage.removeItem(key); else localStorage.setItem(key, val);
    } catch (e) { return null; }
  }
  function rgba(hex, a) { var n = parseInt(hex.slice(1), 16); return "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + a + ")"; }

  // ================= 通信 =================
  function request(method, query, body) {
    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 45000);
    var url = API + (API.indexOf("?") === -1 ? "?" : "&") + query + (PREVIEW ? "&preview=1" : "") + "&_=" + Date.now();
    if (body && PREVIEW) body.preview = "1";
    var opt = { method: method, redirect: "follow", signal: ctrl ? ctrl.signal : undefined };
    if (body) { opt.headers = { "Content-Type": "text/plain;charset=utf-8" }; opt.body = JSON.stringify(body); }
    return fetch(url, opt).then(function (res) {
      clearTimeout(timer);
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    }).then(function (t) {
      try { return JSON.parse(t); }
      catch (e) { throw new Error("サーバーの応答を読み取れませんでした。GASのデプロイ設定（アクセスできるユーザー：全員）を確認してください。"); }
    }, function (err) { clearTimeout(timer); throw err; });
  }

  // ================= 時刻 =================
  function parseTime(s) {
    s = String(s || "").trim();
    var m = s.match(/^(\d{1,2}):(\d{2})$/);
    if (m) return +m[1] + +m[2] / 60;
    if (/^\d{1,2}(\.\d+)?$/.test(s)) return +s;
    return null;
  }
  function fmt(t) { var hh = Math.floor(t), mm = Math.round((t - hh) * 60); return hh + ":" + (mm < 10 ? "0" : "") + mm; }
  function pairError(start, end) {
    if (start === "F") return "";
    var s = parseTime(start);
    if (s === null) return "開始時間がありません";
    if (end === "L") return "";
    var e = parseTime(end);
    if (e === null) return "終了時間がありません";
    if (e <= s) return "終了は開始より後の時間にしてください";
    return "";
  }
  function rowError(r) { return r && r.on ? pairError(r.start, r.end) : ""; }
  function timeText(start, end) { return start === "F" ? "F" : start + " 〜 " + (end || ""); }
  function shortText(start, end) { return start === "F" ? "F" : start + "–" + end; }
  // 時間数（L はラスト＝勤務終了時刻まで。F は数えない）
  function rowHours(r) {
    var s = parseTime(r.start), e = r.end === "L" ? (DATA ? DATA.timeRange.max : 22) : parseTime(r.end);
    return (s !== null && e !== null && e > s) ? Math.round((e - s) * 100) / 100 : null;
  }
  function keyOf(start, end) { return start === "F" ? "F|" : start + "|" + end; }
  function dayClass(d) { return (d.dow === "日" || d.holidayName) ? "sun" : (d.dow === "土" ? "sat" : ""); }

  // ================= 画面の切り替え =================
  function show(view) {
    ["viewInput", "viewConfirm", "viewDone"].forEach(function (v) { $(v).hidden = v !== view; });
    $("toast").classList.remove("show");
    window.scrollTo(0, 0);
  }
  function fatal(title, text, noRetry) {
    $("loading").hidden = true; $("main").hidden = true; $("bar").hidden = true;
    $("fatal").hidden = false; $("fatalTitle").textContent = title; $("fatalText").textContent = text;
    $("btnRetry").hidden = !!noRetry;
  }

  // ================= 起動 =================
  function boot() {
    $("fatal").hidden = true; $("loading").hidden = false;
    if (!API || API.indexOf("ここに") === 0) { fatal("初期設定が必要です", "index.html の API_URL に、GASのウェブアプリURL（…/exec）を貼り付けてください。", true); return; }
    request("GET", "action=init").then(function (res) {
      if (!res.ok) {
        if (res.code === "notyet") fatal("まだ受付前です", res.message || "", true);
        else fatal("読み込めませんでした", res.message || "");
        return;
      }
      DATA = res;
      DATA.timeRange = DATA.timeRange || { min: 9, max: 22 };
      $("period").textContent = DATA.periodLabel;
      document.title = DATA.title;
      $("confirmRange").textContent = DATA.periodLabel;
      if (!DATA.dates.length) { fatal("いまは受付期間外です", DATA.periodLabel + " の日付が勤務入力シートに見つかりません。\n店長に確認してください。", true); return; }
      if (!DATA.staff.length) { fatal("スタッフが見つかりません", "スタッフ名シートを確認してください。"); return; }
      var a = DATA.dates[0], b = DATA.dates[DATA.dates.length - 1];
      $("range").textContent = a.m + "月" + a.d + "日 〜 " + b.m + "月" + b.d + "日 の希望を提出";
      if (DATA.preview) { $("range").textContent += "（テスト表示）"; document.title = "【テスト】" + document.title; }

      setupOptions();
      buildDays(); buildStaffList("");
      $("loading").hidden = true; $("main").hidden = false;
      refresh();
      if (DATA.auth) { showLogin(); loadGsi(); return; }
      $("bar").hidden = false;
      var saved = parseInt(ls(LS_STAFF), 10);
      var hit = DATA.staff.filter(function (s) { return s.no === saved; })[0];
      if (hit) selectStaff(hit);
    }).catch(function (err) {
      fatal("読み込めませんでした", "通信できませんでした。電波の良い場所でもう一度お試しください。\n(" + (err && err.message ? err.message : err) + ")");
    });
  }

  // ================= 時刻の候補 =================
  var DEFAULT_OPTIONS = { start: ["9:30", "11:00", "16:00", "17:00", "18:00", "19:00", "19:30", "F"], end: ["14:30", "15:00", "15:30", "16:00", "17:00", "21:30", "L"] };
  function setupOptions() {
    var o = DATA.timeOptions || {};
    S.opt = { start: (o.start && o.start.length) ? o.start : DEFAULT_OPTIONS.start, end: (o.end && o.end.length) ? o.end : DEFAULT_OPTIONS.end };
    try { var last = JSON.parse(ls(LS_LAST) || "null"); if (last && last.start && !pairError(last.start, last.end)) S.last = last; } catch (e) {}
  }

  // 「ほかの時間」：時と分をタップで選ぶ
  function renderOtherPicker(box, open, which) {
    box.hidden = !open; box.innerHTML = "";

    var E = S.ed, cur = which === "start" ? E.start : E.end, t = parseTime(cur);
    var hh = t === null ? null : Math.floor(t), mm = t === null ? null : Math.round((t - Math.floor(t)) * 60);

  function editorOk() {
    var E = S.ed;

  }

  function snapshotRows() { var o = {}; for (var k in S.rows) o[k] = { on: S.rows[k].on, start: S.rows[k].start, end: S.rows[k].end }; return o; }

  // ================= 名前 =================

  // すでに出している希望を読み込む
  function loadCurrent() {
    var token = ++S.loadToken, no = S.staffNo;
    DATA.dates.forEach(function (d) { S.rows[d.row] = { on: false, start: "", end: "" }; });
    renderAllDays(); setNone(false);
    note("info", "これまでの提出内容を確認しています…");
    $("btnNext").disabled = true;
    var req = DATA.auth
      ? request("POST", "action=current", { action: "current", idToken: S.idToken })
      : request("GET", "action=current&no=" + encodeURIComponent(no));
    req.then(function (res) {
      if (token !== S.loadToken) return;
      $("btnNext").disabled = false;

      });

  function loadGsi() {

    var sc = document.createElement("script");
    sc.src = "https://accounts.google.com/gsi/client"; sc.async = true;

    sc.onerror = function () { $("authText").textContent = "Googleのログイン画面を読み込めませんでした。通信状態を確認して、ページを開き直してください。"; };
    document.head.appendChild(sc);
  }
  function initGsi() {
    google.accounts.id.initialize({ client_id: DATA.auth.clientId, callback: function (r) { onCredential(r.credential); }, auto_select: true, cancel_on_tap_outside: false });
    google.accounts.id.renderButton($("gsiBtn"), { theme: "outline", size: "large", text: "signin_with", shape: "pill", locale: "ja", width: 260 });
    google.accounts.id.prompt();
  }
  function relogin() {

  }
  function onCredential(cred) {
    var prevEmail = S.email, prevNo = S.staffNo;
    S.idToken = cred;
    $("authText").textContent = "確認しています…";
    request("POST", "action=me", { action: "me", idToken: cred }).then(function (res) {
      if (!res.ok) { S.idToken = null; showLogin(res.message || "ログインできませんでした。"); return; }
      S.email = res.email;
      if (!res.registered) {
        showLogin("ログインしました（" + res.email + "）。\n最初に、あなたの名前を選んで登録してください。");
        $("gsiBtn").innerHTML = "";
        $("gsiBtn").appendChild(h("button", { class: "btn btn-primary", type: "button", text: "名前を選んで登録する", onclick: openRegister }));
        openRegister();
        return;
      }
      if (prevEmail === res.email && prevNo === res.staff.no) { showForm(); return; }
      showForm(); selectStaff(res.staff);
    }).catch(function (err) {
      S.idToken = null;

    });
  }
  function openRegister() { S.registering = true; openSheet(); }
  function confirmRegister(s) {

      request("POST", "action=register", { action: "register", idToken: S.idToken, staffNo: s.no }).then(function (res) {
        if (!res.ok) {

          return;
        }
        DATA.staff.forEach(function (x) { if (x.no === res.staff.no) x.taken = true; });
        showForm(); selectStaff(res.staff);
      }).catch(function () { dialog("通信エラー", "登録できませんでした。もう一度お試しください。", "OK", openRegister); });
    }, "選び直す", openRegister);
  }
  function authExpired(onSubmit) {
    dialog("もう一度ログインしてください", "ログインの有効期限が切れました。" + (onSubmit ? "\nログインし直したあと、もう一度「確定・提出」を押してください（入力した内容は残っています）。" : ""), "ログインする", relogin);

  function logout() {

    DATA.dates.forEach(function (d) { S.rows[d.row] = { on: false, start: "", end: "" }; });
    renderAllDays(); setNone(false);
    $("gsiBtn").innerHTML = "";
    showLogin("本人確認のため、Googleアカウントでログインしてください。");
    loadGsi();
  }

  // ================= ダイアログ =================
  var dlgCb = {};
  function dialog(title, text, okLabel, onOk, cancelLabel, onCancel) {
    $("dlgTitle").textContent = title; $("dlgText").textContent = text;
    $("dlgOk").textContent = okLabel || "OK";
    $("dlgCancel").hidden = !cancelLabel; $("dlgCancel").textContent = cancelLabel || "";
    dlgCb = { ok: onOk, cancel: onCancel };
    $("dlg").hidden = false; $("dlgScrim").hidden = false;
    $("dlgOk").focus();
  }
  function closeDialog(which) {
    $("dlg").hidden = true; $("dlgScrim").hidden = true;
    var cb = dlgCb[which]; dlgCb = {}; if (cb) cb();
  }

  // ================= 確認 =================
  function goConfirm() {
    if (S.staffNo === null) { dialog("名前を選んでください", "提出する人の名前を選んでから進んでください。", "名前を選ぶ", openSheet); return; }
    if (S.noShift) { renderConfirm(true); return; }
    var errs = [];
    DATA.dates.forEach(function (d) {
      var msg = rowError(S.rows[d.row]);
      $("day_" + d.row).classList.toggle("err", !!msg);
      if (msg) errs.push(d.display + "：" + msg);
    });
    if (errs.length) {
      dialog("入力を確認してください", errs.join("\n") + "\n\n時間帯を選び直して、その日をタップしてください。", "OK", function () {
        var first = document.querySelector(".day.err"); if (first) first.scrollIntoView({ behavior: "smooth", block: "center" });
      });
      return;
    }
    if (!filledRows().length) {
      dialog("1日も選ばれていません", "今回はシフトを出さない（希望なし）として提出しますか？", "希望なしで進む", function () { setNone(true); renderConfirm(true); }, "戻る");
      return;
    }
    renderConfirm(false);
  }
  function renderConfirm(none) {
    $("cName").textContent = S.staffLabel;
    var stats = $("cStats"), list = $("cList");
    stats.innerHTML = ""; list.innerHTML = "";
    if (none) {
      stats.appendChild(h("span", { class: "stat none", text: "希望なし（シフトを出さない）" }));
      $("cDetail").textContent = DATA.periodLabel + " は1日も入りません";
      $("cListLabel").textContent = "内容";
      list.appendChild(h("div", { class: "cnone", text: "この期間（" + DATA.periodLabel + "）は\nシフトを出さずに提出します。" }));
    } else {
      var f = filledRows(), wd = 0, hd = 0;
      f.forEach(function (d) {
        var r = S.rows[d.row];
        if (d.isKyujitsu) hd++; else wd++;
        var hrs = rowHours(r);
        list.appendChild(h("div", { class: "crow" }, [
          h("div", { class: "cd " + dayClass(d), text: d.display }),
          h("div", { class: "ct" }, [timeText(r.start, r.end), hrs ? h("small", { text: "(" + hrs + "時間)" }) : null])
        ]));
      });
      stats.appendChild(h("span", { class: "stat", text: "合計希望日数: " + f.length + " 日" }));
      var tot = totalHours(f);
      $("cDetail").textContent = "(平日: " + wd + " 日, 休日: " + hd + " 日)" + (tot.h ? "\n合計 " + tot.h + " 時間" + (tot.f ? "（F " + tot.f + "日を除く）" : "") : "");
      $("cListLabel").textContent = "希望";
    }
    show("viewConfirm");
  }

  // ================= 提出 =================
  function setSending(on) {
    S.sending = on;
    var b = $("btnSubmit");
    b.disabled = on; $("btnBack").disabled = on;
    b.innerHTML = "";
    if (on) { b.appendChild(h("span", { class: "spinner" })); b.appendChild(document.createTextNode("送信しています…")); }
    else b.textContent = "この内容で確定・提出する";
  }
  function submit() {
    if (S.sending) return;
    var shifts = {};
    if (!S.noShift) DATA.dates.forEach(function (d) {
      var r = S.rows[d.row];
      shifts["row_" + d.row] = r.on ? { start: r.start, end: r.start === "F" ? "" : r.end } : { start: "", end: "" };
    });
    setSending(true);
    request("POST", "action=submit", { action: "submit", idToken: S.idToken, staffNo: S.staffNo, staffLabel: S.staffLabel, noShift: S.noShift, shifts: shifts })
      .then(function (res) {
        setSending(false);
        if (res && res.ok) { $("doneMsg").textContent = res.message; show("viewDone"); }
        else if (res && res.code === "auth") authExpired(true);
        else dialog("提出できませんでした", (res && res.message) || "もう一度お試しください。");
      })
      .catch(function (err) {
        setSending(false);
        dialog("通信エラー", "送信できたか確認できませんでした。\n電波の良い場所でもう一度「確定・提出」を押してください（同じ内容で上書きされるだけなので、2回押しても問題ありません）。\n(" + (err && err.message ? err.message : err) + ")");
      });
  }

  // ================= イベント =================
  $("btnRetry").addEventListener("click", boot);
  $("btnWho").addEventListener("click", openSheet);
  $("scrim").addEventListener("click", closeSheet);
  $("search").addEventListener("input", function () { buildStaffList(this.value); });
  $("btnNone").addEventListener("click", function () { setNone(!S.noShift); });
  $("btnClearAll").addEventListener("click", clearAll);
  $("toastUndo").addEventListener("click", undo);
  $("btnBulk").addEventListener("click", function () { openEditor("bulk"); });
  $("edScrim").addEventListener("click", closeEditor);
  $("btnEdOk").addEventListener("click", editorOk);
  $("btnEdOff").addEventListener("click", editorOff);
  document.querySelectorAll("[data-pick]").forEach(function (b) { b.addEventListener("click", function () { pickBy(b.getAttribute("data-pick")); }); });
  $("btnNext").addEventListener("click", goConfirm);
  $("btnBack").addEventListener("click", function () { show("viewInput"); });
  $("btnSubmit").addEventListener("click", submit);
  $("btnAgain").addEventListener("click", function () { show("viewInput"); loadCurrent(); });
  $("btnLogout").addEventListener("click", logout);
  $("dlgOk").addEventListener("click", function () { closeDialog("ok"); });
  $("dlgCancel").addEventListener("click", function () { closeDialog("cancel"); });
  $("dlgScrim").addEventListener("click", function () { closeDialog("cancel"); });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (!$("dlg").hidden) closeDialog("cancel"); else if (!$("ed").hidden) closeEditor(); else if (!$("sheet").hidden) closeSheet();
  });
  boot();
})();
</script>
</body>
</html>
